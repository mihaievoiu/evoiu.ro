---
layout: default
title: Galleries
---
<div class="page-header">
  <h1>Galleries</h1>
  <p>A collection of photographic work across different subjects and places.</p>
</div>

<div class="container" style="padding-bottom: 5rem">
  <div class="gallery-grid">
    {% for gallery in site.galleries %}
    <a class="gallery-card" href="{{ site.baseurl }}{{ gallery.url }}">
      <div class="gallery-card-img-wrap">
        <img class="gallery-card-img" src="{{ gallery.cover }}" alt="{{ gallery.title }}" loading="lazy">
      </div>
      <div class="gallery-card-body">
        <h2 class="gallery-card-title">{{ gallery.title }}</h2>
        <p class="gallery-card-desc">{{ gallery.description }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
