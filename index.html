---
layout: default
hero: true
---
<section class="hero">
  <div class="hero-bg" style="background-image: url('https://picsum.photos/seed/evoiu-hero/1920/1080')"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Evoiu</h1>
    <p>Photography &amp; Visual Stories</p>
  </div>
  <div class="hero-scroll">Scroll</div>
</section>

<section class="section">
  <p class="section-label">Galleries</p>
  <div class="gallery-grid">
    {% for gallery in site.galleries %}
    <a class="gallery-card" href="{{ site.baseurl }}{{ gallery.url }}">
      <div class="gallery-card-img-wrap">
        <img class="gallery-card-img" src="{{ gallery.cover }}" alt="{{ gallery.title }}" loading="lazy">
      </div>
      <div class="gallery-card-body">
        <h2 class="gallery-card-title">{{ gallery.title }}</h2>
        <p class="gallery-card-desc">{{ gallery.description }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
</section>
