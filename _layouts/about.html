---
layout: default
---
<div class="about-layout">
  {% if page.photo %}
  {% include cloudinary_img.html
     src=page.photo
     alt=page.name
     class="about-photo"
     sizes="(max-width: 700px) 100vw, 400px" %}
  {% endif %}
  <div class="about-content">
    <h1>{{ page.name }}</h1>
    {% if page.lead %}<p class="about-lead">{{ page.lead }}</p>{% endif %}
    <div class="about-body">{{ content }}</div>
  </div>
</div>
