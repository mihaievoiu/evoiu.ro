---
layout: default
---
<div class="post-header">
  <a class="back-btn" href="{{ site.baseurl }}/blog.html">All Posts</a>
  <div class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
</div>

{% if page.cover %}
<img class="post-cover"
     src="{{ site.baseurl }}{{ page.cover }}"
     alt="{{ page.title }}">
{% endif %}

<div class="post-body">{{ content }}</div>
